version: '3.8'

# ==============================================================================
# Nova Discord Feed Bot — PRODUCTION Distributed Microservices Specification
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database (Production Tuned)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: nova_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - nova-prod-net

  # ----------------------------------------------------------------------------
  # Redis Queue & Distributed Bus (Production)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nova_redis_prod
    restart: always
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-secure_prod_redis_pass}
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secure_prod_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - nova-prod-net

  # ----------------------------------------------------------------------------
  # Microservice 1: Discord Gateway & Dispatcher Worker
  # ----------------------------------------------------------------------------
  gateway_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nova_gateway_prod
    restart: always
    command: ["python", "-m", "workers.gateway_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-secure_prod_redis_pass}@redis:6379/0
      - QUEUE_BACKEND=redis
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - nova-prod-net

  # ----------------------------------------------------------------------------
  # Microservice 2: Feed Ingestion & Polling Pipeline Worker
  # ----------------------------------------------------------------------------
  feed_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nova_feed_worker_prod
    restart: always
    command: ["python", "-m", "workers.feed_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-secure_prod_redis_pass}@redis:6379/0
      - QUEUE_BACKEND=redis
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - nova-prod-net

  # ----------------------------------------------------------------------------
  # Microservice 3: FastAPI REST, Admin Dashboard & Stripe Webhooks
  # ----------------------------------------------------------------------------
  api_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nova_api_worker_prod
    restart: always
    command: ["python", "-m", "workers.api_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.prod
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-secure_prod_redis_pass}@redis:6379/0
      - WEBHOOK_HOST=0.0.0.0
      - WEBHOOK_PORT=8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - nova-prod-net

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

networks:
  nova-prod-net:
    driver: bridge
