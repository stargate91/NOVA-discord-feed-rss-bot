name: CI & Quality Assurance

on:
  push:
    branches: [ "main", "develop", "master" ]
  pull_request:
    branches: [ "main", "develop", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-validate:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8

      - name: Run Ruff Linter
        run: |
          ruff check . --ignore E501,F401,F841 || true

  unit-and-integration-tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nova_user
          POSTGRES_PASSWORD: nova_test_password
          POSTGRES_DB: feed_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Run Test Suite with Coverage
        env:
          DATABASE_URL: postgresql://nova_user:nova_test_password@localhost:5432/feed_bot_test
          REDIS_URL: redis://localhost:6379/0
          WEBHOOK_SECRET: test_ci_secret_key_12345
          ENVIRONMENT: test
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report -m
          coverage html

      - name: Upload Coverage HTML Report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage_html_report/
