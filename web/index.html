<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/images/logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070a12" />
    <meta name="robots" content="index, follow" />
    
    <!-- Primary Meta Tags -->
    <title>Nova Feeds — Next-Generation Discord Notification Bot</title>
    <meta name="title" content="Nova Feeds — Next-Generation Discord Notification Bot" />
    <meta name="description" content="Lightning-fast social notifications, media drops, release alerts, and live stream updates for your Discord community. Powered by resilient asyncio worker architecture." />
    <meta name="keywords" content="discord bot, social feeds, twitch live alerts, youtube discord notifications, kick stream monitor, free epic games bot, steam deals discord, discord feed alerts" />
    <meta name="author" content="Nova Team" />

    <!-- Open Graph / Facebook / Discord Embed -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nova Feeds" />
    <meta property="og:url" content="https://novafeeds.xyz/" />
    <meta property="og:title" content="Nova Feeds — Next-Generation Discord Notification Bot" />
    <meta property="og:description" content="Lightning-fast social notifications, media drops, release alerts, and live stream updates for your Discord community." />
    <meta property="og:image" content="https://novafeeds.xyz/images/logo.webp" />

    <!-- Twitter Card -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://novafeeds.xyz/" />
    <meta property="twitter:title" content="Nova Feeds — Next-Generation Discord Notification Bot" />
    <meta property="twitter:description" content="Lightning-fast social notifications, media drops, release alerts, and live stream updates for your Discord community." />
    <meta property="twitter:image" content="https://novafeeds.xyz/images/logo.webp" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Nova Feeds",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Discord / Web Browser",
        "url": "https://novafeeds.xyz",
        "description": "Next-generation Discord bot providing real-time notifications for YouTube, Twitch, Kick, Free Games, Movies, and RSS feeds.",
        "offers": {
          "@type": "Offer",
          "price": "0.00",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- Typography (Non-render-blocking asynchronous font loading) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
