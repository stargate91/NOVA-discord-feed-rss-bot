    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Nova Feeds",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Discord / Web Browser",
        "url": "https://novafeeds.xyz",

        }

    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Resource Hints (DNS Prefetch & Preconnect for High-Speed API, CDN & Fonts Latency) -->
    <link rel="dns-prefetch" href="https://api.novafeeds.xyz" />
    <link rel="preconnect" href="https://api.novafeeds.xyz" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.discordapp.com" />

    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Typography (Non-render-blocking asynchronous font loading with swap & subset weights) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&family=Outfit:wght@600;700;800&display=swap"

      media="print"
      onload="this.media='all'"
    />
    <noscript>

      />
    </noscript>
