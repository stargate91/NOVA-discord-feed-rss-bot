[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-feed-bot"
version = "2.5.0"
description = "Enterprise Multi-Tenant Discord Feed Aggregator, Notification Bot and Microservices Pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary / All Rights Reserved" }
authors = [
    { name = "Nova Team", email = "dev@novabot.io" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "discord.py>=2.3.0",
    "python-dotenv>=1.0.0",
    "colorama>=0.4.6",
    "feedparser>=6.0.10",
    "aiohttp>=3.9.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "stripe>=8.0.0",
    "asyncpg>=0.29.0",
    "SQLAlchemy>=2.0.28",
    "alembic>=1.13.1",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "redis>=5.0.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "coverage>=7.4.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",
    "pip-audit>=2.7.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E501", # Line length handled by formatter
    "E722", # Bare except (used for graceful network retries)
    "E402", # Module level import not at top of file
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "strict"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["core", "engine", "db", "services", "models", "api", "workers"]
omit = [
    "tests/*",
    "migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
]
