version: '3.8'

services:
  # --------------------------------------------------------------------------
  # PostgreSQL Database (Asyncpg / SQLAlchemy / Alembic)
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: nova_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nova_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nova_password_secure}
      POSTGRES_DB: ${POSTGRES_DB:-feed_bot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nova_user} -d ${POSTGRES_DB:-feed_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nova-network

  # --------------------------------------------------------------------------
  # Redis Queue & Distributed Worker Cache
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nova_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nova-network

  # --------------------------------------------------------------------------
  # Nova Discord Feed Bot & API Gateway
  # --------------------------------------------------------------------------
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nova_bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nova_user}:${POSTGRES_PASSWORD:-nova_password_secure}@postgres:5432/${POSTGRES_DB:-feed_bot}
      - REDIS_URL=redis://redis:6379/0
      - WEBHOOK_HOST=0.0.0.0
      - WEBHOOK_PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - bot_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - nova-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  bot_data:
    driver: local

networks:
  nova-network:
    driver: bridge
