apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-api-worker
  namespace: nova-bot
  labels:
    app.kubernetes.io/name: nova-api-worker
    app.kubernetes.io/component: api
spec:
  replicas: 2  # Horizontally scalable REST & Webhook workers
  selector:
    matchLabels:
      app.kubernetes.io/name: nova-api-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nova-api-worker
    spec:
      containers:
        - name: api-worker
          image: ghcr.io/stargate91/nova-feed-bot:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "workers.api_worker"]
          ports:
            - name: http-api
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: nova-config
            - secretRef:
                name: nova-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: http-api
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http-api
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
