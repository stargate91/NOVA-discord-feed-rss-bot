apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-feed-worker
  namespace: nova-bot
  labels:
    app.kubernetes.io/name: nova-feed-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 2  # Horizontally scalable ingestion workers
  selector:
    matchLabels:
      app.kubernetes.io/name: nova-feed-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nova-feed-worker
    spec:
      containers:
        - name: feed-worker
          image: ghcr.io/stargate91/nova-feed-bot:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "workers.feed_worker"]
          envFrom:
            - configMapRef:
                name: nova-config
            - secretRef:
                name: nova-secrets
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: 2000m
              memory: 2048Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
