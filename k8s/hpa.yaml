apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nova-feed-worker-hpa
  namespace: nova-bot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nova-feed-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nova-api-worker-hpa
  namespace: nova-bot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nova-api-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
