apiVersion: v1
kind: Service
metadata:
  name: nova-api-service
  namespace: nova-bot
  labels:
    app.kubernetes.io/name: nova-api-worker
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: nova-api-worker
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nova-api-ingress
  namespace: nova-bot
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
spec:
  tls:
    - hosts:
        - api.yourbotdomain.com
      secretName: nova-api-tls
  rules:
    - host: api.yourbotdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nova-api-service
                port:
                  number: 80
