apiVersion: v1
kind: ConfigMap
metadata:
  name: nova-config
  namespace: nova-bot
data:
  ENVIRONMENT: "production"
  BOT_PREFIX: "!"
  WEBHOOK_HOST: "0.0.0.0"
  WEBHOOK_PORT: "8080"
  QUEUE_BACKEND: "redis"
  REDIS_URL: "redis://:$(REDIS_PASSWORD)@redis-service.nova-bot.svc.cluster.local:6379/0"
  DATABASE_URL: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-service.nova-bot.svc.cluster.local:5432/$(POSTGRES_DB)"
  LOG_LEVEL: "INFO"
